# k0rdent catalog runai-cp, step 4 "Deploy service": Cert-Manager AWS secret  (EXAMPLE - placeholders only)
# Copy to 4-cert-manager-aws-secret.yaml (git-ignored), fill __AWS_ACCESS_KEY_ID__ / __AWS_SECRET_ACCESS_KEY__
# with the runai-dns-user keys, then: kubectl apply -f 4-cert-manager-aws-secret.yaml  (management cluster)
# Delivers Secret prod-route53-credentials-secret to namespace cert-manager on gpu-cluster,
# used by the letsencrypt-prod ClusterIssuer (accessKeyIDSecretRef / secretAccessKeySecretRef).
apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-aws-secret
  namespace: kcm-system
type: addons.projectsveltos.io/cluster-profile
stringData:
  secret.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: prod-route53-credentials-secret
      namespace: cert-manager
    type: Opaque
    stringData:
      AccessKeyID: "__AWS_ACCESS_KEY_ID__"            # Change me
      SecretAccessKey: "__AWS_SECRET_ACCESS_KEY__"    # Change me
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplate
metadata:
  name: cert-manager-aws-secret
  namespace: kcm-system
spec:
  resources:
    localSourceRef:
      kind: Secret
      name: cert-manager-aws-secret
    deploymentType: Remote
    path: ""  # will be ignored
