# gpu-cluster: raise inotify limits on every node (k0s 1.36 / containerd 2.x + ~85 pods exhausted the default 128).
# Applied directly to gpu-cluster (not via k0rdent) on 2026-10-20 during the k0s 1.36 upgrade.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-inotify-sysctl
  namespace: kube-system
  labels: { app: node-inotify-sysctl }
spec:
  selector: { matchLabels: { app: node-inotify-sysctl } }
  template:
    metadata: { labels: { app: node-inotify-sysctl } }
    spec:
      priorityClassName: system-node-critical
      tolerations: [{ operator: Exists }]
      initContainers:
      - name: sysctl
        image: busybox:1.36
        securityContext: { privileged: true }
        command: ["sh","-c","sysctl -w fs.inotify.max_user_instances=8192 && sysctl -w fs.inotify.max_user_watches=1048576"]
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources: { requests: { cpu: 1m, memory: 8Mi }, limits: { memory: 16Mi } }
