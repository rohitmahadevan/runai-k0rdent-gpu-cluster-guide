# k0rdent catalog runai-cp, step 4 "Deploy service": External-DNS AWS secret  (EXAMPLE - placeholders only)
# Copy to 3-external-dns-aws-secret.yaml (git-ignored), fill __AWS_ACCESS_KEY_ID__ / __AWS_SECRET_ACCESS_KEY__
# with the runai-dns-user keys, then: kubectl apply -f 3-external-dns-aws-secret.yaml  (management cluster)
#
# Differences from the catalog example:
#  - values nested under "external-dns:" (the catalog chart wraps upstream external-dns; top-level values are ignored)
#  - limited to lab.example.com (domainFilters); owns only its own records (txtOwnerId); never deletes (upsert-only)
kind: Secret
apiVersion: v1
metadata:
  name: service-external-dns-values
  namespace: kcm-system
type: addons.projectsveltos.io/cluster-profile      # This is necessary for Sveltos secret delegation
stringData:
  values: |
    external-dns:
      provider:
        name: aws
      env:
      - name: AWS_REGION
        value: us-east-1
      - name: AWS_ACCESS_KEY_ID
        value: "__AWS_ACCESS_KEY_ID__"
      - name: AWS_SECRET_ACCESS_KEY
        value: "__AWS_SECRET_ACCESS_KEY__"
      domainFilters:
        - lab.example.com
      txtOwnerId: gpu-cluster
      policy: upsert-only
